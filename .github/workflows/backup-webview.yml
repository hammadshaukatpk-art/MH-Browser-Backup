name: Restore full MH Browser WebView backup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backup-webview.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Copy pinned WebView source, not GeckoView branch
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="3e76312ca5ac59ad4dcc45ea081e9fa860fce919"
          mkdir -p /tmp/mh-browser-webview
          git -C /tmp/mh-browser-webview init
          git -C /tmp/mh-browser-webview remote add origin https://github.com/hammadshaukatpk-art/MH-Browser.git
          git -C /tmp/mh-browser-webview fetch --depth=1 origin "$SOURCE_SHA"
          git -C /tmp/mh-browser-webview checkout --detach FETCH_HEAD
          test "$(git -C /tmp/mh-browser-webview rev-parse HEAD)" = "$SOURCE_SHA"
          test -f /tmp/mh-browser-webview/app/src/main/java/com/mh/browser/BrowserActivity.java
          test ! -f /tmp/mh-browser-webview/app/src/main/java/com/mh/browser/GeckoBrowserActivity.java
          rsync -a --delete --exclude='.git' --exclude='.github/workflows/backup-webview.yml' /tmp/mh-browser-webview/ ./
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Full MH Browser WebView backup from $SOURCE_SHA (pre-Gecko)"
            git push origin HEAD:main
          fi
          echo "Backed up MH Browser WebView source commit $SOURCE_SHA"
